name: iOS UI tests

# The native checks run on the Mac mini that builds and ships the app, with its Xcode and iOS
# (`.agents/tools/validate-ios.sh`). GitHub's macOS image runs an older Xcode and iOS than the one
# we ship with, so this stays a manual tool for a rare second opinion, never a gate.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Test classes or Class/testMethod names, comma-separated (empty runs the whole suite)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ui:
    name: iOS UI tests
    concurrency:
      group: ui-tests-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the image's default Xcode
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | sed 's/ *$//; s/ /-/g')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ios
          key: derived-data-ui-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/**') }}
          restore-keys: derived-data-ui-${{ steps.xcode.outputs.version }}-
      - name: Run native UI tests
        # Ad hoc simulator signing, as in .agents/tools/validate-ios.sh. LiveConnectionTests
        # compiles out without LIVE_HERMES_UI_TESTS, so it needs no exclusion here. The
        # screenshot tour skips itself unless asked for evidence, and is excluded to say so.
        # A manual run can name just the tests it needs, so checking one fix takes minutes:
        #   gh workflow run "iOS UI tests" --ref BRANCH -f only=VaultFlowTests,DailyFlowTests/testSearchOpensTheMatchingReply
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if ! [[ "$ONLY" =~ ^[A-Za-z0-9_/,]*$ ]]; then echo "only: use letters, digits, _, / and commas" >&2; exit 1; fi
          selection=(-only-testing:AgentInterfaceUITests)
          if [ -n "$ONLY" ]; then
            selection=()
            IFS=, read -ra tests <<< "$ONLY"
            for test in "${tests[@]}"; do [ -n "$test" ] && selection+=("-only-testing:AgentInterfaceUITests/$test"); done
          fi
          simulator=$(bash ios/tools/ci-simulator.sh)
          xcodebuild -project ios/AgentInterface.xcodeproj -scheme AgentInterface \
            -destination "platform=iOS Simulator,id=$simulator" -derivedDataPath build/ios \
            -resultBundlePath build/ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            -parallel-testing-enabled NO "${selection[@]}" \
            -skip-testing:AgentInterfaceUITests/ScreenshotTourTests test
      - name: Keep the result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-tests-xcresult
          path: build/ui-tests.xcresult
          if-no-files-found: ignore
          retention-days: 14

name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Node ${{ matrix.node-version || '(.node-version)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # The primary version comes from .node-version so it cannot drift.
          - node-version-file: .node-version
          - node-version: 26.13.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  browser:
    # A real Chromium against the built client and the real server, over a scripted assistant runtime.
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Browsers come from the cache when present; the system libraries are installed either way.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  release-archive:
    # The host builds from archive-release.py's tarball, not a checkout. A file the build reads and
    # the archive leaves out fails here instead of in a production release.
    name: Release archive builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Build from the release archive, as the host does
        run: |
          python3 .agents/tools/archive-release.py "$RUNNER_TEMP/release.tar.gz"
          mkdir "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP/release.tar.gz" -C "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          npm ci
          npm run build
  python:
    # Runs once, on the Python the Hermes host runs (scripts/spike/requirements.lock.txt).
    name: Python 3.14.7
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.14.7
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      # Some tests start node, as the Hermes host does.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pip install -r .github/requirements-ci.txt
      - name: Check Python syntax
        run: python -m compileall -q src/hermes scripts .agents/tools
      - name: Check for undefined names and likely bugs
        run: ruff check --output-format=github .
      - name: Install tmux for the terminal and computer tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux
      - name: Run Python tests
        run: python scripts/run-python-tests.py

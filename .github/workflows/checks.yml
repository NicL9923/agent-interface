name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24.21.0, 26.10.0]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check Python syntax
        run: python3 -m compileall -q src/hermes scripts
      - name: Check dashboard startup boundaries
        run: python3 scripts/spike/dashboard_contract_test.py
      - name: Check qualification boundaries
        run: python3 scripts/spike/qualification_contract_test.py
      - name: Check integration authorization and file boundaries
        run: python3 tests/hermes_integrations_test.py
      - name: Check upgrade and recovery control plane
        run: python3 scripts/hermes-upgrade-worker-test.py
      - name: Check Linux upgrade hooks
        run: python3 tests/hermes_upgrade_linux_test.py
      - name: Check persistent gateway maintenance
        run: python3 tests/hermes_gateway_guard_test.py
      - name: Check managed dependency fingerprints
        run: python3 scripts/hermes-qualified-python-test.py

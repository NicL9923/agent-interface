name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Node ${{ matrix.node-version || '(.node-version)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # The primary version comes from .node-version so it cannot drift.
          - node-version-file: .node-version
          - node-version: 26.13.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
      - name: Install pnpm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pnpm" "$(node -p "require('./package.json').packageManager")"
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, build and tests in parallel
        run: pnpm run verify:ci
  browser:
    if: github.event_name != 'pull_request'
    # A real browser against the built client and the real server, over a scripted assistant runtime. Each browser
    # is its own job, so the two halves run side by side.
    name: Browser smoke (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Playwright's image carries both browsers and their system libraries, so nothing comes from a package mirror.
    # tests/workflows.test.ts fails unless its version is the installed @playwright/test and its digest is the one
    # .github/playwright-image-digests.json records for that version.
    # User 1001 is the runner's own, so the checkout stays writable by the runner after the job.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      options: --user 1001 --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
      # The image ships its own Node. This puts the repository's pinned one first on PATH for pnpm install and the tests.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pnpm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pnpm" "$(node -p "require('./package.json').packageManager")"
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  release-archive:
    # The host builds from archive-release.py's tarball, not a checkout. A file the build reads and
    # the archive leaves out fails here instead of in a production release.
    name: Release archive builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pnpm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pnpm" "$(node -p "require('./package.json').packageManager")"
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Build from the release archive, as the host does
        run: |
          python3 .agents/tools/archive-release.py "$RUNNER_TEMP/release.tar.gz"
          mkdir "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP/release.tar.gz" -C "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          pnpm install --frozen-lockfile
          pnpm run build
  python:
    # Runs once, on the Python the Hermes host runs (scripts/spike/requirements.lock.txt).
    name: Python 3.14.7
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.14.7
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      # Some tests start node, as the Hermes host does.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pip install -r .github/requirements-ci.txt
      - name: Install tmux for the terminal and computer tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux
      - name: Check Python syntax, lint and tests in parallel
        shell: bash
        run: |
          # Syntax compilation has its own cache so imports in tests cannot share writes.
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/python-syntax-cache" python -m compileall -q scripts .agents/tools &
          syntax_pid=$!
          ruff check --output-format=github . &
          lint_pid=$!
          python scripts/run-python-tests.py &
          test_pid=$!
          failed=0
          for check_spec in "syntax:$syntax_pid" "lint:$lint_pid" "tests:$test_pid"; do
            check_name=${check_spec%%:*}
            check_pid=${check_spec#*:}
            if wait "$check_pid"; then
              printf '%s: passed\n' "$check_name"
            else
              check_status=$?
              printf '%s: failed (%s)\n' "$check_name" "$check_status" >&2
              failed=1
            fi
          done
          exit "$failed"

name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Node ${{ matrix.node-version || '(.node-version)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # The primary version comes from .node-version so it cannot drift.
          - node-version-file: .node-version
          - node-version: 26.10.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  python:
    # Runs once, on the Python the Hermes host runs (scripts/spike/requirements.lock.txt).
    name: Python 3.14.7
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.7
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      # Some tests start node, as the Hermes host does.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pip install -r .github/requirements-ci.txt
      - name: Check Python syntax
        run: python -m compileall -q src/hermes scripts .agents/tools
      - name: Check for undefined names and likely bugs
        run: ruff check --output-format=github .
      - name: Install tmux for the terminal and computer tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux
      - name: Run Python tests
        run: python scripts/run-python-tests.py
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide whether the native tests are needed
        id: scope
        # Release records and other documentation-only pull requests cannot change the app, so
        # they skip the slow macOS job. Pushes to main and every other change still run it.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ] \
            && ! git diff --name-only "$BASE"...HEAD | grep -qvE '^docs/|\.md$'; then
            echo "native=false" >> "$GITHUB_OUTPUT"
          else
            echo "native=true" >> "$GITHUB_OUTPUT"
          fi
  native:
    name: iOS unit tests
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the image's default Xcode
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | sed 's/ *$//; s/ /-/g')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ios
          key: derived-data-unit-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/**') }}
          restore-keys: derived-data-unit-${{ steps.xcode.outputs.version }}-
      - name: Run native unit tests
        # Ad hoc simulator signing, as in .agents/tools/validate-ios.sh. The fixture UI tests
        # run in ui-tests.yml: nightly, on demand and on pull requests labeled ui-tests.
        run: |
          simulator=$(bash ios/tools/ci-simulator.sh)
          xcodebuild -project ios/AgentInterface.xcodeproj -scheme AgentInterface \
            -destination "platform=iOS Simulator,id=$simulator" -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            -parallel-testing-enabled NO -only-testing:AgentInterfaceTests test

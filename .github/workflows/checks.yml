name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Node ${{ matrix.node-version || '(.node-version)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # The primary version comes from .node-version so it cannot drift.
          - node-version-file: .node-version
          - node-version: 26.10.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  python:
    # Runs once, on the Python the Hermes host runs (scripts/spike/requirements.lock.txt).
    name: Python 3.14.7
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.14.7
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      # Some tests start node, as the Hermes host does.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pip install -r .github/requirements-ci.txt
      - name: Check Python syntax
        run: python -m compileall -q src/hermes scripts .agents/tools
      - name: Check for undefined names and likely bugs
        run: ruff check --output-format=github .
      - name: Install tmux for the terminal and computer tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux
      - name: Run Python tests
        run: python scripts/run-python-tests.py

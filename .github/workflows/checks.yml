name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Node ${{ matrix.node-version || '(.node-version)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # The primary version comes from .node-version so it cannot drift.
          - node-version-file: .node-version
          - node-version: 26.10.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  python:
    # Runs once, on the Python the Hermes host runs (scripts/spike/requirements.lock.txt).
    name: Python 3.14.7
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.7
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      # Some tests start node, as the Hermes host does.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: pip install -r .github/requirements-ci.txt
      - name: Check Python syntax
        run: python -m compileall -q src/hermes scripts .agents/tools
      - name: Check for undefined names and likely bugs
        run: ruff check --output-format=github .
      - name: Install tmux for the terminal and computer tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux
      - name: Run Python tests
        run: python scripts/run-python-tests.py
  native:
    name: iOS unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the image's default Xcode
        run: xcodebuild -version
      - name: Run native unit tests
        # Ad hoc simulator signing, as in .agents/tools/validate-ios.sh. UI tests run locally.
        run: |
          simulator=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          version = lambda runtime: [int(part) for part in runtime.rsplit("iOS-", 1)[1].split("-")]
          runtimes = sorted((runtime for runtime in devices if ".iOS-" in runtime), key=version, reverse=True)
          print(next(device["udid"] for runtime in runtimes for device in devices[runtime] if device["name"].startswith("iPhone")))
          ')
          xcodebuild -project ios/AgentInterface.xcodeproj -scheme AgentInterface \
            -destination "platform=iOS Simulator,id=$simulator" -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            -parallel-testing-enabled NO -only-testing:AgentInterfaceTests test

name: Dependency audit

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.7
      - name: Audit production npm dependencies
        run: npm audit --omit=dev
      - name: Audit pinned Python dependencies
        run: |
          pip install -r .github/requirements-ci.txt
          # The lock pins every version, so skip resolving and building packages.
          # Accepted on 2026-10-14: live Hermes pins PyJWT 2.13.0 upstream, and a fix
          # would arrive with a Hermes update. These 14 PyJWT advisories are the only
          # ones ignored, so any new advisory still fails the job.
          pip-audit -r scripts/spike/requirements.lock.txt --no-deps --disable-pip \
            --ignore-vuln PYSEC-2026-4140 \
            --ignore-vuln PYSEC-2026-4141 \
            --ignore-vuln PYSEC-2026-4142 \
            --ignore-vuln PYSEC-2026-4143 \
            --ignore-vuln PYSEC-2026-4144 \
            --ignore-vuln PYSEC-2026-4145 \
            --ignore-vuln PYSEC-2026-4146 \
            --ignore-vuln PYSEC-2026-4147 \
            --ignore-vuln PYSEC-2026-4148 \
            --ignore-vuln PYSEC-2026-4149 \
            --ignore-vuln PYSEC-2026-4150 \
            --ignore-vuln PYSEC-2026-4151 \
            --ignore-vuln PYSEC-2026-4152 \
            --ignore-vuln PYSEC-2026-4183

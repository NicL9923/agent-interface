name: Dependency audit

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pnpm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pnpm" "$(node -p "require('./package.json').packageManager")"
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"
      - name: Audit production pnpm dependencies
        run: pnpm audit --prod

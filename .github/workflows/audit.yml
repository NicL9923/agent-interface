name: Dependency audit

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.7
      - name: Audit production npm dependencies
        run: npm audit --omit=dev
      - name: Audit pinned Python dependencies
        run: |
          pip install -r .github/requirements-ci.txt
          # The lock pins every version, so skip resolving and building packages.
          if ! pip-audit -r scripts/spike/requirements.lock.txt --no-deps --disable-pip; then
            echo "::error::The lock mirrors the Python environment live Hermes runs, so do not bump it by hand. A fix arrives through a Hermes update, or through the locally approved Hermes repair."
            exit 1
          fi

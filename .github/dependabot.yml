version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  # CI tools in .github/requirements-ci.txt only. Dependabot would read any
  # .txt requirements file here, but scripts/spike/requirements.lock.txt is
  # deliberately not covered: it mirrors the Python environment of the Hermes
  # revision this app is qualified against, which comes from Hermes upstream's
  # uv.lock. Bumping it alone would make qualification test a different
  # environment than production. Its updates arrive through a Hermes update, and
  # the weekly audit workflow still checks it for known vulnerabilities.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
